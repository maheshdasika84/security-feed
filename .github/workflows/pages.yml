name: Publish threat feed

# Serves threat_feed.json at https://maheshdasika84.github.io/security-feed/threat_feed.json
# (DEFAULT_FEED_URL in Security). Feeds are signed OFFLINE and committed; this workflow never sees
# a private key and refuses to publish a feed the app would reject (verify_feed.py).
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the verifier's only dependency (hash-pinned)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Refuse a feed the app would reject
        run: python verify_feed.py threat_feed.json

      - name: Stage site (feed only)
        run: |
          mkdir -p _site
          cp threat_feed.json _site/threat_feed.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
